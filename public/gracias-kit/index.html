<style>
:root{--noche:#0B1F33;--noche2:#061321;--perg:#F7F3EA;--tinta:#16293D;--oro:#C6A460;--oro2:#9a7c3f;--bruma:#93A6BA;--linea:rgba(22,41,61,.16);
--serif:'Instrument Serif',Georgia,serif;--sans:'Instrument Sans',-apple-system,'Segoe UI',sans-serif;--mono:'Space Mono','Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:linear-gradient(180deg,var(--noche),var(--noche2));color:var(--tinta);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 70px}
.hero{position:relative;overflow:hidden;text-align:center;padding:72px 18px 46px;color:var(--perg)}
.drop{position:absolute;top:-40px;width:2px;border-radius:2px;background:linear-gradient(180deg,transparent,rgba(247,243,234,.55));animation:fall linear infinite}
.drop.g{background:linear-gradient(180deg,transparent,rgba(198,164,96,.7))}
@keyframes fall{to{transform:translateY(120vh)}}
@media (prefers-reduced-motion:reduce){.drop{animation:none;top:12%}}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.4em;color:var(--oro);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:400;font-size:42px;font-size:clamp(36px,9vw,54px);line-height:1.06;margin:16px 0 10px}
h1 em,.gold{font-style:italic;color:var(--oro)}
.sub{font-family:var(--serif);font-style:italic;font-size:19px;font-size:clamp(18px,4vw,22px);color:var(--bruma);max-width:520px;margin:0 auto}
.card{background:var(--perg);border-radius:18px;padding:26px 22px;margin-top:22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card h2{font-family:var(--serif);font-weight:400;font-size:25px;font-size:clamp(23px,5.5vw,28px);line-height:1.15;margin-bottom:12px}
.card h2 em{font-style:italic;color:var(--oro2)}
.num{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--oro2);text-transform:uppercase;display:block;margin-bottom:6px}
p{margin-bottom:11px}
strong{font-weight:600}
ul.pl{list-style:none}
ul.pl li{padding:9px 0 9px 24px;position:relative;border-bottom:1px solid var(--linea)}
ul.pl li:last-child{border-bottom:none}
ul.pl li:before{content:"·";position:absolute;left:6px;color:var(--oro2);font-weight:700}
ol{margin:6px 0 10px 20px}
ol li{padding:4px 0}
.btn{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:17px 20px;margin:14px 0;font-size:17px;line-height:1.35}
.btn.p{background:var(--perg);color:var(--tinta);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.btn.p b{display:block;font-size:19px}
.btn.p span{font-size:14px;color:#4a5a6b}
.btn.gold{background:var(--oro);color:var(--noche);font-weight:600;letter-spacing:.02em}
.btn.o{border:1px solid rgba(198,164,96,.55);color:var(--perg);font-size:15px}
.quote{border-left:2px solid var(--oro);padding:4px 0 4px 16px;margin:14px 0;font-family:var(--serif);font-style:italic;font-size:18px;color:#3c4c5e}
.small{font-size:14px;color:#5b6b7c}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;border:1px solid rgba(198,164,96,.5);color:var(--perg);border-radius:99px;padding:6px 12px;margin:4px}
details{border-bottom:1px solid var(--linea);padding:10px 0}
details:last-of-type{border-bottom:none}
summary{font-weight:600;cursor:pointer;list-style:none;position:relative;padding-right:22px}
summary:after{content:"+";position:absolute;right:2px;color:var(--oro2);font-family:var(--mono)}
details[open] summary:after{content:"–"}
details p{margin:8px 0 2px;font-size:15.5px;color:#3c4c5e}
footer{text-align:center;padding:56px 18px 36px;color:var(--bruma)}
footer .fl{font-family:var(--mono);font-size:10.5px;letter-spacing:.38em;color:var(--oro)}
hr.g{border:none;height:1px;width:100px;background:var(--oro);margin:0 auto 16px;opacity:.7}
@media (max-width:390px){.card{padding:22px 16px}}
</style>
</head>
<body>
<header class="hero">
  <span class="drop" style="left:8%;height:22px;animation-duration:7s"></span>
  <span class="drop g" style="left:18%;height:15px;animation-duration:9s;animation-delay:2.2s"></span>
  <span class="drop" style="left:31%;height:26px;animation-duration:6.4s;animation-delay:1.1s"></span>
  <span class="drop" style="left:45%;height:14px;animation-duration:8.6s;animation-delay:3.4s"></span>
  <span class="drop g" style="left:58%;height:20px;animation-duration:7.6s;animation-delay:.6s"></span>
  <span class="drop" style="left:71%;height:24px;animation-duration:6.8s;animation-delay:2.8s"></span>
  <span class="drop" style="left:84%;height:16px;animation-duration:9.4s;animation-delay:1.7s"></span>
  <span class="drop g" style="left:93%;height:21px;animation-duration:7.2s;animation-delay:4.1s"></span>
  <div class="eyebrow">KIT LEMA</div>
  <h1>Listo. <em>Es tuyo.</em></h1>
  <p class="sub">Revisa tu WhatsApp: ahí va tu KIT LEMA. Úsalo este domingo.</p>
</header>
<div class="wrap">
<a class="btn gold" href="/beca">AHORA CONOCE LA BECA VIGÍA →</a>
</div>
<footer>
  <hr class="g">
  <div class="fl">EL ARKA · MÉRIDA · MMXXVI</div>
  
</footer>
</body>
</html>
